# 文献综述型论文 CoT 模板
# 系统梳理研究进展，指出空白与展望

适用章节:
  - 国内研究现状
  - 国外研究现状
  - 研究述评
  - 研究展望

CoT 链路:
  - step4a_doctrines       # 梳理已有研究
  - step4b_analysis         # 评析各研究的贡献与不足
  - step4c_review           # 变体: 研究空白型
  - step5_polish

说明: |
  综述型不需要三段论，跳过 Step 1/2/3。
  核心是 4a 梳理 + 4b 评析 + 4c 指出空白。
  Step 4c 使用 review 变体，输出研究空白和未来方向。
