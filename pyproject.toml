[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "juriscot"
version = "0.1.0"
description = "法学思维链推理引擎 —— LawAutoPaper 的核心推理组件"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
juriscot = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
